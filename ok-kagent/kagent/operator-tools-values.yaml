# Separate, namespace-scoped tool server for the controlled OK-129 write drill.
# The chart creates the ServiceAccount; permissions are supplied by the
# public-safe Role and RoleBinding in openkubes.
fullnameOverride: kagent-lab-tools

tools:
  enabledTools:
    - k8s
  metrics:
    # The standalone chart otherwise renders tools and metrics on the same
    # container port, which Kubernetes rejects as a duplicate port key.
    port: "8085"
  image:
    tag: "0.2.1"

rbac:
  create: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
