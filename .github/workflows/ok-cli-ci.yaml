name: ok CLI checks

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ok-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Test all packages offline from clusters
        run: go test -mod=readonly ./... -count=1

      - name: Vet all packages
        run: go vet -mod=readonly ./...

      - name: Build and smoke-test the CLI
        run: |
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/ok" ./cmd/ok
          "$RUNNER_TEMP/ok" --help
          "$RUNNER_TEMP/ok" destroy --help
          "$RUNNER_TEMP/ok" destroy cluster --help
          "$RUNNER_TEMP/ok" cluster destroy --help
          "$RUNNER_TEMP/ok" up --help
          "$RUNNER_TEMP/ok" up requirements
          "$RUNNER_TEMP/ok" up cluster-template
          "$RUNNER_TEMP/ok" up network-suggest --help
          "$RUNNER_TEMP/ok" up render --help
          "$RUNNER_TEMP/ok" up bind --help
          "$RUNNER_TEMP/ok" config --help
          "$RUNNER_TEMP/ok" config init --help
          "$RUNNER_TEMP/ok" config show --help
          "$RUNNER_TEMP/ok" cluster --help
          "$RUNNER_TEMP/ok" cluster create --help
          "$RUNNER_TEMP/ok" cluster create requirements
          "$RUNNER_TEMP/ok" cluster stage run --help
          "$RUNNER_TEMP/ok" cluster stage run full prepare --help
          "$RUNNER_TEMP/ok" authority --help
          "$RUNNER_TEMP/ok" authority stage --help
          "$RUNNER_TEMP/ok" evidence --help
          "$RUNNER_TEMP/ok" evidence observability --help
          "$RUNNER_TEMP/ok" version

      - name: Test interactive path setup on a real terminal
        run: OK_CLI_TEST_BINARY="$RUNNER_TEMP/ok" python3 -B tests/ok_cli_config_interactive_test.py

      - name: Test network proposals with synthetic inventories and fake APIs
        run: |
          python3 -m venv "$RUNNER_TEMP/network-tests"
          "$RUNNER_TEMP/network-tests/bin/pip" install PyYAML==6.0.3
          PATH="$RUNNER_TEMP/network-tests/bin:$PATH" OK_CLI_TEST_BINARY="$RUNNER_TEMP/ok" python3 -B tests/ok_cli_network_suggest_test.py

      - name: Check out reviewed profile owner for offline preparation tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openkubes/ok-linux
          ref: a1687263d46c48e47c14f5bf202c9a652d7c1a71
          path: .ci/ok-linux
          persist-credentials: false

      - name: Test automatic preparation and runner handoff without cluster access
        run: |
          PATH="$RUNNER_TEMP/network-tests/bin:$PATH" \
          OK_CLI_TEST_BINARY="$RUNNER_TEMP/ok" \
          OK_CLI_TEST_OK_LINUX_PATH="$GITHUB_WORKSPACE/.ci/ok-linux" \
          python3 -B tests/ok147_cluster_intent_test.py

  target-admission-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Buildx action
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image into the local runner only
        run: make ok-target-admission-image-build
        env:
          OK_TARGET_ADMISSION_IMAGE_BUILD: yes
          OK_TARGET_ADMISSION_IMAGE: ok147-target-admission:ci
          OK_TARGET_ADMISSION_IMAGE_REVISION: ${{ github.sha }}

      - name: Verify non-root offline startup
        run: make ok-target-admission-image-smoke
        env:
          OK_TARGET_ADMISSION_IMAGE: ok147-target-admission:ci
