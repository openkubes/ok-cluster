<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" viewBox="0 0 1280 805" width="1280" height="805"><title id="title">Blue/Green BYOH management handover</title><desc id="desc">Variant A — one logical ownership transfer for the entire management domain. clusterctl move is not atomic, a universal fence, or an automatic rollback mechanism.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526278"/></marker></defs><rect width="1280" height="805" fill="#F7FAFE"/><rect width="1280" height="9" fill="#2563EB"/><text x="52" y="59" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#15243B">Blue/Green BYOH management handover</text><text x="52" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526278">Variant A — one logical ownership transfer for the entire management domain</text><rect x="54" y="119" width="168" height="27" rx="13.5" fill="#047857" opacity=".11"/><text x="138" y="138" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857">BLUE  ·  ACTIVE</text><rect x="893" y="119" width="207" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="996.5" y="138" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">GREEN  ·  FENCED</text><rect x="54" y="168" width="332" height="140" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="74" y="200" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">BYOH Management BLUE</text><text x="74" y="227" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Current management-domain owner</text><text x="74" y="250" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">CAPI / BYOH reconciliation</text><text x="74" y="273" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Ownership epoch N</text><rect x="893" y="168" width="332" height="140" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="913" y="200" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">BYOH Management GREEN</text><text x="913" y="227" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Compatible CAPI and providers</text><text x="913" y="250" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">No effective lifecycle writes</text><text x="913" y="273" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Prepared independently</text><rect x="430" y="176" width="417" height="120" rx="16" fill="#FFFBEB" stroke="#E8D3AB" stroke-width="1.6"/><text x="450" y="208" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Independent ownership / fencing</text><text x="450" y="235" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Atomic domain epoch transition</text><text x="450" y="258" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Credential revocation + verified write denial</text><path d="M386 233 H422" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M847 233 H884" fill="none" stroke="#526278" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#15243B">DOMAIN-SCOPED HANDOVER CONTRACT</text><rect x="199" y="367" width="882" height="39" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="210" y="373" width="44" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="232" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">01</text><text x="271" y="393" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Prepare Green / compatibility gate</text><rect x="199" y="414" width="882" height="39" rx="8" fill="#FFFBEB" stroke="#CBD5E1"/><rect x="210" y="420" width="44" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="232" y="439" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">02</text><text x="271" y="440" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Quiesce operations; fence Blue + gate Green</text><rect x="199" y="461" width="882" height="39" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="210" y="467" width="44" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="232" y="486" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">03</text><text x="271" y="487" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Move supported CAPI resources; inventory</text><rect x="199" y="508" width="882" height="39" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="210" y="514" width="44" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="232" y="533" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">04</text><text x="271" y="534" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Verify BYOH bindings and infrastructure reality</text><rect x="199" y="555" width="882" height="39" rx="8" fill="#ECFDF5" stroke="#CBD5E1"/><rect x="210" y="561" width="44" height="27" rx="13.5" fill="#047857" opacity=".11"/><text x="232" y="580" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857">05</text><text x="271" y="581" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Commit epoch N+1; activate Green</text><rect x="199" y="602" width="882" height="39" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="210" y="608" width="44" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="232" y="627" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">06</text><text x="271" y="628" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#15243B">Retire Blue; preserve evidence</text><text x="64" y="689" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#15243B">Workload clusters 1...N: existing APIs, machines and workloads remain in place.</text><text x="64" y="717" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#B91C1C">Failure after object move: freeze both effective write paths; investigate, never blind-retry.</text><path d="M52 738 H1228" stroke="#CBD5E1" stroke-width="1.3"/><text x="52" y="768" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">clusterctl move is not atomic, a universal fence, or an automatic rollback mechanism.</text><text x="1228" y="768" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563EB">OPENKUBES  ·  ARCHITECTURE TARGET</text></svg>