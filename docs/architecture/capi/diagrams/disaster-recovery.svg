<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" viewBox="0 0 1280 820" width="1280" height="820"><title id="title">Cold disaster recovery and safe BYOH reattachment</title><desc id="desc">Restore management control without replacing existing workload clusters. Stale backups, resurrected Blue and changed API trust require explicit validation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526278"/></marker></defs><rect width="1280" height="820" fill="#F7FAFE"/><rect width="1280" height="9" fill="#2563EB"/><text x="52" y="59" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#15243B">Cold disaster recovery and safe BYOH reattachment</text><text x="52" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526278">Restore management control without replacing existing workload clusters</text><rect x="54" y="147" width="343" height="121" rx="16" fill="#FEF2F2" stroke="#F3B5B5" stroke-width="1.6"/><text x="74" y="179" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#B91C1C">BLUE management LOST</text><text x="74" y="206" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Unreachable API / lost etcd</text><text x="74" y="229" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">No clusterctl move possible</text><rect x="468" y="147" width="343" height="121" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="488" y="179" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Independent recovery sources</text><text x="488" y="206" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Git + IaC state + Velero / S3</text><text x="488" y="229" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Secrets + ownership evidence</text><rect x="882" y="147" width="343" height="121" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="902" y="179" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Existing BYOH workloads</text><text x="902" y="206" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Kubernetes remains running</text><text x="902" y="229" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Lifecycle automation may pause</text><text x="640" y="305" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#15243B">COLD RECOVERY — NO AUTOMATIC FAILOVER</text><rect x="54" y="334" width="556" height="89" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="74" y="366" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">1  Detect and freeze</text><text x="74" y="393" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Record the incident; block lifecycle mutations</text><rect x="669" y="334" width="556" height="89" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="689" y="366" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">2  Fence old owner</text><text x="689" y="393" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Prove Blue cannot execute effective writes</text><rect x="54" y="451" width="556" height="89" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="74" y="483" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">3  Rebuild and restore</text><text x="74" y="510" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Fresh management plane; Git + verified Velero state</text><rect x="669" y="451" width="556" height="89" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="689" y="483" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">4  Discover and compare</text><text x="689" y="510" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Machines, IDs, hosts, credentials, API trust</text><rect x="54" y="568" width="556" height="89" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="74" y="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">5  Authorize new owner</text><text x="74" y="627" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Approve epoch N+1 after consistency checks</text><rect x="669" y="568" width="556" height="89" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="689" y="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">6  Activate and observe</text><text x="689" y="627" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Resume CAPI/BYOH; verify no reprovisioning</text><path d="M397 207 H459" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M811 207 H873" fill="none" stroke="#526278" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="54" y="734" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#B91C1C">Failure policy: restored objects carry data, not permission to reconcile existing infrastructure.</text><path d="M52 753 H1228" stroke="#CBD5E1" stroke-width="1.3"/><text x="52" y="783" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">Stale backups, resurrected Blue and changed API trust require explicit validation.</text><text x="1228" y="783" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563EB">OPENKUBES  ·  ARCHITECTURE TARGET</text></svg>