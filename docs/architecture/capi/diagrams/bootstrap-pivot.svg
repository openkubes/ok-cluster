<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" viewBox="0 0 1280 760" width="1280" height="760"><title id="title">Bootstrap and management placement</title><desc id="desc">One lightweight kind/CAPI/BYOH bootstrap, two explicitly different paths. Provisioning never triggers an automatic clusterctl move; identity and version gates apply.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526278"/></marker></defs><rect width="1280" height="760" fill="#F7FAFE"/><rect width="1280" height="9" fill="#2563EB"/><text x="52" y="59" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#15243B">Bootstrap and management placement</text><text x="52" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526278">One lightweight kind/CAPI/BYOH bootstrap, two explicitly different paths</text><rect x="54" y="118" width="215" height="27" rx="13.5" fill="#2563EB" opacity=".11"/><text x="161.5" y="137" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">SELF-MANAGED PIVOT</text><rect x="715" y="118" width="201" height="27" rx="13.5" fill="#047857" opacity=".11"/><text x="815.5" y="137" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857">CENTRALIZED PATH</text><rect x="54" y="178" width="267" height="102" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="74" y="210" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">1  Provision bootstrap VM</text><text x="74" y="237" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">kind + compatible CAPI + BYOH</text><rect x="54" y="350" width="267" height="102" rx="16" fill="#FFFFFF" stroke="#AFC9F9" stroke-width="1.6"/><text x="74" y="382" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">2  Provision workload</text><text x="74" y="409" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">BYOH hosts; Kubernetes API</text><rect x="54" y="522" width="267" height="102" rx="16" fill="#FFFFFF" stroke="#AFC9F9" stroke-width="1.6"/><text x="74" y="554" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">3  Install target CAPI</text><text x="74" y="581" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">CRDs / controller / providers</text><path d="M187 280 V341" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M187 452 V513" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="393" y="522" width="268" height="102" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="413" y="554" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">4  Authorized CAPI pivot</text><text x="413" y="581" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">clusterctl move + verify</text><path d="M321 572 H385" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="713" y="178" width="466" height="102" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="733" y="210" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Bootstrap VM: kind + CAPI + BYOH</text><text x="733" y="237" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Disposable bootstrap; separately controlled</text><rect x="713" y="350" width="466" height="102" rx="16" fill="#FFFFFF" stroke="#A9DFC9" stroke-width="1.6"/><text x="733" y="382" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">BYOH management cluster</text><text x="733" y="409" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Dedicated lifecycle domain; compatible CAPI stack</text><path d="M945 280 V341" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="713" y="522" width="466" height="102" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="733" y="554" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Manage existing workload clusters</text><text x="733" y="581" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">No workload pivot in this centralized path</text><path d="M945 452 V513" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="54" y="673" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">A successful pivot requires move readiness, object inventory and target verification.</text><text x="713" y="673" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">Management replacement later uses a separate ADR-CAPI-006 handover.</text><path d="M52 693 H1228" stroke="#CBD5E1" stroke-width="1.3"/><text x="52" y="723" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">Provisioning never triggers an automatic clusterctl move; identity and version gates apply.</text><text x="1228" y="723" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563EB">OPENKUBES  ·  ARCHITECTURE TARGET</text></svg>