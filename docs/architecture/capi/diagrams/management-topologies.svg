<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" viewBox="0 0 1280 780" width="1280" height="780"><title id="title">Two management topologies</title><desc id="desc">Shared lifecycle principles, different management failure domains. Logical architecture; topology choice is based on failure domains, not a hard cluster-count limit.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526278"/></marker></defs><rect width="1280" height="780" fill="#F7FAFE"/><rect width="1280" height="9" fill="#2563EB"/><text x="52" y="59" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#15243B">Two management topologies</text><text x="52" y="88" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526278">Shared lifecycle principles, different management failure domains</text><text x="54" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#2563EB">MODEL A</text><text x="668" y="141" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" fill="#047857">MODEL B</text><rect x="50" y="162" width="570" height="124" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="70" y="194" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Self-managed CAPI</text><text x="70" y="221" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">CAPI runs inside the cluster it manages</text><text x="70" y="244" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Bootstrap uses a separate temporary environment</text><rect x="660" y="162" width="570" height="124" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="680" y="194" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Centralized CAPI + BYOH shadow</text><text x="680" y="221" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">One dedicated management domain owns all clusters</text><text x="680" y="244" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Green stays write-fenced until domain handover</text><rect x="84" y="347" width="216" height="106" rx="16" fill="#FFFFFF" stroke="#AFC9F9" stroke-width="1.6"/><text x="104" y="379" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Bootstrap (kind)</text><text x="104" y="406" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Temporary CAPI / BYOH</text><rect x="364" y="347" width="214" height="106" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="384" y="379" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Workload cluster A</text><text x="384" y="406" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">CAPI + workloads</text><path d="M300 399 H358" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="331" y="387" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#526278">Pivot</text><rect x="78" y="516" width="500" height="74" rx="16" fill="#FFFFFF" stroke="#AFC9F9" stroke-width="1.6"/><text x="98" y="548" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#15243B">Independent cluster B</text><text x="98" y="575" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Own CAPI version, lifecycle, failure domain</text><rect x="691" y="329" width="225" height="110" rx="16" fill="#ECFDF5" stroke="#A9DFC9" stroke-width="1.6"/><text x="711" y="361" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Management BLUE</text><text x="711" y="388" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Active CAPI owner</text><text x="711" y="411" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Epoch N</text><rect x="970" y="329" width="225" height="110" rx="16" fill="#EFF6FF" stroke="#AFC9F9" stroke-width="1.6"/><text x="990" y="361" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Management GREEN</text><text x="990" y="388" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Prepared; fenced</text><text x="990" y="411" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">No lifecycle writes</text><path d="M916 383 H963" fill="none" stroke="#526278" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="943" y="369" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#526278">Handover</text><rect x="692" y="518" width="500" height="74" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="712" y="550" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#15243B">Existing workload clusters (1 ... N)</text><text x="712" y="577" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526278">Kubernetes and infrastructure stay in place</text><path d="M805 439 V511" fill="none" stroke="#526278" stroke-width="2.6"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1085 439 V484 H1015 V511" fill="none" stroke="#526278" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="54" y="641" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#526278">Failure domain: individual workload cluster</text><text x="667" y="641" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#526278">Failure domain: shared lifecycle manager; workloads independent</text><path d="M52 713 H1228" stroke="#CBD5E1" stroke-width="1.3"/><text x="52" y="743" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#526278">Logical architecture; topology choice is based on failure domains, not a hard cluster-count limit.</text><text x="1228" y="743" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563EB">OPENKUBES  ·  ARCHITECTURE TARGET</text></svg>