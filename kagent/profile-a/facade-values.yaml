# Facade Helm values for ok-ai (OK-92). Real provider values live here (private
# repo convention). Install:
#   helm upgrade --install platform-diagnostics-facade \
#     ../../../openkubes/platform/ai/platform-diagnostics/profiles/kagent/charts/platform-diagnostics-facade \
#     --kubeconfig ~/.kube/ok-ai.yaml -n platform-diagnostics --create-namespace \
#     -f facade-values.yaml
#
# (the Makefile in this folder wraps it as `make deploy-facade`.)

image:
  # GHCR is the primary registry (OK-15). Build MULTI-ARCH (amd64 nodes reject an
  # arm64-only image built on Apple Silicon with "no match for platform"):
  #   docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
  #     -t ghcr.io/openkubes/platform-diagnostics-facade:0.1.0 --push .
  # NOTE: set the GHCR package visibility to Public (per-package, not inherited).
  repository: ghcr.io/openkubes/platform-diagnostics-facade
  tag: "0.1.0"

# If the GHCR package is private, ok-ai needs pull creds. Either make the package
# public (it is a public repo anyway), or create a pull secret and name it here:
#   kubectl -n platform-diagnostics create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT-with-read:packages>
imagePullSecrets: []
#  - name: ghcr-pull

kagent:
  # kagent CONTROLLER service serves A2A on 8083 (confirmed from `get svc`).
  baseUrl: "http://kagent-controller.kagent.svc.cluster.local:8083"
  namespace: "platform-diagnostics"
  agent: "openkubes-platform-agent"
  # token: "" — kagent UI/API auth not enabled in the eval install; set if hardened.

# ok-ai runs Talos: no host journal / node shell. This is a capability delta,
# reported via EvidenceRef.status=unavailable — never a contract delta (ADR-021).
providerCapabilities:
  workload_events: true
  workload_logs: true
  cilium_diagnostics: true
  host_journal: false
  node_shell: false
